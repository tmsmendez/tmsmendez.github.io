<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
<rect width="640" height="400" fill="#1b365d"/>
<!-- incident beam -->
<g stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round">
  <path d="M60 110 L300 244"/>
</g>
<circle cx="60" cy="110" r="9" fill="#ffffff"/>
<!-- scattered lobes -->
<g stroke="#ffffff" stroke-width="3" opacity="0.7" fill="none" stroke-linecap="round">
  <path d="M300 244 L360 96"/>
  <path d="M300 244 L440 130"/>
  <path d="M300 244 L500 190"/>
  <path d="M300 244 L250 92"/>
  <path d="M300 244 L150 150"/>
  <path d="M300 244 L540 250"/>
</g>
<!-- diffusive surface: wells of varying depth -->
<g fill="#b7a57a">
  <rect x="100" y="248" width="38" height="96"/>
  <rect x="146" y="284" width="38" height="60"/>
  <rect x="192" y="256" width="38" height="88"/>
  <rect x="238" y="300" width="38" height="44"/>
  <rect x="284" y="248" width="38" height="96" fill="#e8dfc6"/>
  <rect x="330" y="292" width="38" height="52"/>
  <rect x="376" y="264" width="38" height="80"/>
  <rect x="422" y="308" width="38" height="36"/>
  <rect x="468" y="272" width="38" height="72"/>
  <rect x="514" y="252" width="38" height="92"/>
</g>
<rect x="100" y="344" width="452" height="8" fill="#e8dfc6"/>
<text x="60" y="66" font-family="Georgia, serif" font-size="38" font-weight="bold" fill="#ffffff">Diffusive surfaces</text>
</svg>
