<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
<rect width="640" height="400" fill="#1b365d"/>
<!-- smooth NURBS curve vs faceted mesh approximation of the same surface -->
<path d="M80 250 Q320 90 560 250" fill="none" stroke="#e8dfc6" stroke-width="7" stroke-linecap="round"/>
<polyline points="80,250 176,186 272,142 368,142 464,186 560,250" fill="none"
          stroke="#b7a57a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<g fill="#b7a57a">
  <circle cx="176" cy="186" r="7"/><circle cx="272" cy="142" r="7"/>
  <circle cx="368" cy="142" r="7"/><circle cx="464" cy="186" r="7"/>
</g>
<!-- one source, two divergent reflected paths -->
<circle cx="320" cy="352" r="9" fill="#ffffff"/>
<g fill="none" stroke-width="3" stroke-linecap="round">
  <path d="M320 352 L272 142 L120 330" stroke="#b7a57a" opacity="0.95"/>
  <path d="M320 352 L272 152 L196 344" stroke="#ffffff" opacity="0.9" stroke-dasharray="10 8"/>
  <path d="M320 352 L464 186 L556 330" stroke="#b7a57a" opacity="0.95"/>
  <path d="M320 352 L466 176 L490 340" stroke="#ffffff" opacity="0.9" stroke-dasharray="10 8"/>
</g>
<text x="80" y="70" font-family="Georgia, serif" font-size="38" font-weight="bold" fill="#ffffff">NURBS vs mesh</text>
</svg>
