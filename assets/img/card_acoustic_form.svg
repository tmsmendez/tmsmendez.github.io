<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
<rect width="640" height="400" fill="#1b365d"/>
<g fill="none" stroke-linecap="round">
  <!-- family of shell sections, from flat to deep -->
  <path d="M60 330 Q320 300 580 330" stroke="#2f5d94" stroke-width="5"/>
  <path d="M60 330 Q320 240 580 330" stroke="#4a7ab5" stroke-width="5"/>
  <path d="M60 330 Q320 170 580 330" stroke="#b7a57a" stroke-width="6"/>
  <path d="M60 330 Q320 100 580 330" stroke="#e8dfc6" stroke-width="7"/>
  <!-- sound rays reflecting off the selected shell -->
  <g stroke="#ffffff" stroke-width="3" opacity="0.85">
    <path d="M320 330 L190 150"/>
    <path d="M190 150 L120 300"/>
    <path d="M320 330 L320 118"/>
    <path d="M320 118 L320 300"/>
    <path d="M320 330 L450 150"/>
    <path d="M450 150 L520 300"/>
  </g>
</g>
<g fill="#ffffff">
  <circle cx="320" cy="330" r="8"/>
  <circle cx="120" cy="300" r="6"/><circle cx="320" cy="300" r="6"/><circle cx="520" cy="300" r="6"/>
</g>
<text x="60" y="80" font-family="Georgia, serif" font-size="38" font-weight="bold" fill="#ffffff">Acoustic + structural form</text>
</svg>
